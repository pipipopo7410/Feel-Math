const CHARACTERS=[['bunny','小兔兔','🐰'],['car','小汽車','🚗'],['plane','小飛機','✈️'],['cat','小貓咪','🐱'],['apple','蘋果','🍎'],['candy','糖果','🍬']];

const characterName=()=>CHARACTERS.find(x=>x[0]===character)?.[1]||'小兔兔';

 if(!voiceOn||!('speechSynthesis' in window))return;
 try{const synth=window.speechSynthesis;synth.cancel();let u=new SpeechSynthesisUtterance(message);u.lang='zh-TW';u.rate=.87;u.pitch=1.08;u.volume=.95;

let soundOn=(()=>{try{return localStorage.getItem('num-island-sound-v21')!=='off';}catch(e){return true;}})();
let audioCtx=null;
function playSound(kind='tap'){
 if(!soundOn)return;
 try{
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!audioCtx)audioCtx=new A();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});

  const notes=kind==='win'?[[523,.00,.11],[659,.105,.11],[784,.21,.18]]:kind==='try'?[[392,0,.11],[349,.13,.13]]:kind==='move'?[[587,0,.065],[740,.065,.085]]:[[587,0,.075]];

  });

}

let view='home',mode='count',q=null,rounds={},wrong=0,hints=0,done=false,db=null,history=[],dbFallback=false,offlineReady=false,feedback='',modal='',selectedZone='left',splitStyle='free',drag=null,suppressClickUntil=0,autoNextTimer=null;

function learningStatus(es){let clean=es.filter(e=>e.independent).length;let ranges=new Set(es.filter(e=>e.independent).map(e=>e.range||10));if(!es.length)return {name:'尚未觀察',pct:0};if(!clean)return {name:'目前需要支持',pct:13};if(clean<3)return {name:'開始累積證據',pct:30};if(clean<7)return {name:'熟悉任務可獨立完成',pct:61};if(ranges.size>=2)return {name:'跨數量範圍持續觀察',pct:90};return {name:'熟悉範圍表現穩定',pct:76};}
function recommend(){const cnt=eventsFor('count'), cmp=eventsFor('compare'), spl=eventsFor('split'), tens=eventsFor('tens');if(cnt.filter(e=>e.independent).length<3)return 'count';if(cmp.filter(e=>e.independent).length<3)return 'compare';if(spl.filter(e=>e.independent).length<3)return 'split';if(level===100&&tens.filter(e=>e.independent).length<3)return 'tens';const sorted=Object.keys(MODES).filter(x=>x!=='free').sort((a,b)=>eventsFor(a).length-eventsFor(b).length);return sorted[0]||'line';}

function challengeNum(max,min=0,m=''){const round=rounds[m]||0, anchors=[0,1,9,10,11,19,20,21,29,30,49,50,51,79,90,98,99,100].filter(n=>n>=min&&n<=max);if(round%5===0)return anchors[rand(0,anchors.length-1)];if(round%7===0)return [max,min,Math.min(max,10),Math.min(max,20)][rand(0,3)];return rand(min,max);}
function optionsFor(answer,max=100,min=0){let xs=new Set([answer]);const offsets=shuffle([1,-1,2,-2,10,-10,9,-9,5,-5,11,-11,20,-20]);for(const delta of offsets){if(xs.size>=3)break;let n=answer+delta;if(n>=min&&n<=max)xs.add(n);}while(xs.size<3){let k=rand(min,max);xs.add(k);}return shuffle([...xs]);}
function generate(m){rounds[m]=(rounds[m]||0)+1;const max=getRange(m),r=rounds[m];if(m==='count'){let n=challengeNum(max,0,m);return {n,choices:optionsFor(n,max,0),style:n<=20?(r%4===0?'dots':'frames'):'blocks'};}
if(m==='compare'){let a=challengeNum(max,0,m),b;if(r%4===0){b=a;}else {const d=rand(1,max<=10?4:max<=20?7:20)*(Math.random()<.5?1:-1);b=clamp(a+d,0,max);if(a===b)b=a===max?max-1:a+1;}return {a,b};}
if(m==='split'){let n=challengeNum(max,2,m);let goal=(r%3===0);let target=rand(1,n-1);return {n,style:splitStyle,goal,target,beads:Array.from({length:n},()=> 'pool'),parts:[0,0],moves:[]};}
if(m==='fill'){let total=challengeNum(max,1,m),start=rand(0,total-1),delta=total-start;if(max>20){delta=rand(1,Math.min(total,24));start=total-delta;}return {total,start,beads:Array.from({length:Math.min(30,delta+rand(2,5))},()=> 'pool'),steps:[]};}
if(m==='line'){
 if(r===1)return {from:4,to:7,current:4,lineMin:0,lineMax:10,steps:[]};
 let from=challengeNum(max,0,m),delta=(max<=10?rand(1,5):max<=20?rand(1,9):rand(1,15))*(r%2===0?-1:1);
 if(from+delta<0||from+delta>max)delta=-delta;
 if(from+delta<0||from+delta>max)delta=from===0?1:-1;
 const to=from+delta;
 // 先決定本題可見範圍，之後不再因拖曳或按鍵重新定位。
 const span=max<=10?10:max<=20?20:Math.min(max,Math.max(14,Math.abs(delta)+6));
 const lineMin=clamp(Math.floor((from+to-span)/2),0,max-span);
 const lineMax=lineMin+span;
 return {from,to,current:from,lineMin,lineMax,steps:[]};
}
if(m==='tens'){
 if(r===1&&max>=23)return {kind:'build',n:23,t:0,u:0,steps:[],justPacked:false};
 if(r%3===0&&max>=10){
   const n=challengeNum(max,10,m),t=Math.floor(n/10);
   // 預先有九顆在虛線十格盒，讓孩子親手放進第十顆並看到整盒收起。
   if(t>=1)return {kind:'exchange',n,t:t-1,u:9,steps:[],justPacked:false};
 }
 return {kind:'build',n:challengeNum(max,0,m),t:0,u:0,steps:[],justPacked:false};
}
if(m==='bridge'){const sub=r%2===0;let candidates=[];if(sub){for(let a=11;a<=max;a++){let unit=a%10;if(unit<1||unit>8)continue;for(let b=unit+1;b<=Math.min(9,a);b++)candidates.push([a,b]);}}else{for(let a=1;a<max;a++){let u=a%10;if(!u)continue;const first=10-u;for(let b=first+1;b<=Math.min(9,max-a);b++)candidates.push([a,b]);}}if(!candidates.length){return {sub:false,a:8,b:5,step:2,stage:1,picked:null,choices:[2,1,3],answer:13,steps:[]};}const [a,b]=candidates[rand(0,candidates.length-1)],step=sub?a%10:10-a%10;return {sub,a,b,step,stage:1,picked:null,choices:optionsFor(step,9,1),answer:a+(sub?-b:b),steps:[]};}
if(m==='calc'){let sub=r%2===0,a,b;if(sub){a=challengeNum(max,1,m);b=rand(1,Math.min(a,max===100?30:8));}else{a=challengeNum(max-1,0,m);b=rand(1,Math.min(max-a,max===100?30:8));}return {a,b,sub,current:a,beads:Array.from({length:sub?a:Math.min(35,b+rand(2,5))},()=>sub?'source':'pool'),steps:[]};}
return {t:0,u:0,steps:[]};}

function chunkDisplay(n){

}
function packedBeads(ids){

   const slice=ids.slice(i,i+10);
   packs.push(`<div class="token-pack ten packed-egg" aria-label="完整的一盒十個物件">${slice.map(x=>bead(x)).join('')}</div>`);
 }

}

function parent(){const logs=existing().filter(e=>e.success),clean=logs.filter(e=>e.independent).length, ranges=new Set(logs.map(e=>e.range||10));const summary=`<div class="metrics"><div class="metric"><small>完成任務</small><strong>${logs.length}</strong></div><div class="metric"><small>未使用提示完成</small><strong>${clean}</strong></div><div class="metric"><small>接觸的數量範圍</small><strong>${ranges.size} / 3</strong></div></div>`;

function render(){ROOT.innerHTML=`<div class="app">${header()}${view==='home'?home():view==='parent'?parent():game()}<div class="tiny-note">數感小島 2.4 · 0～100</div></div>${modal}`;}
function wrongAnswer(){playSound('try');wrong++;feedback='wrong';if(wrong>=2)hints=Math.max(1,hints);render();speechSay('再試一次');}
function answerValue(v){if(done)return;if(mode==='count'){Number(v)===q.n?win(`數量辨識：${q.n}`,{representation:q.style}):wrongAnswer();} }
function compare(v){if(done)return;const res=q.a===q.b?'equal':q.a>q.b?'left':'right';v===res?win(`比較 ${q.a} 和 ${q.b}`):wrongAnswer();}
function beadMove(i,dest){if(done||!['split','fill','calc'].includes(mode)||!q?.beads||!Number.isInteger(i)||i<0||i>=q.beads.length)return;const source=q.beads[i],allowed=mode==='split'?['pool','left','right']:mode==='fill'?['pool','target']:q.sub?['source','out']:['pool','target'];if(!allowed.includes(dest)||dest===source)return;q.beads[i]=dest;(q.moves||(q.moves=[])).push({from:source,to:dest});(q.steps||(q.steps=[])).push(dest);feedback='';playSound('move');render();}
function check(){if(done)return;let ok=false,detail='',meta={};if(mode==='split'){const parts=[zoneBeads('left').length,zoneBeads('right').length];ok=parts[0]+parts[1]===q.n&&parts[0]>0&&parts[1]>0&&(q.style!=='goal'||parts[0]===q.target);detail=`${q.n} → ${parts[0]} + ${parts[1]}`;meta={parts,actions:q.moves.length,kind:q.style};}
else if(mode==='fill'){const filled=zoneBeads('target').length;ok=q.start+filled===q.total;detail=`補足：${q.start} + ${q.total-q.start} = ${q.total}`;meta={moves:q.steps};}
else if(mode==='line'){ok=q.current===q.to;detail=`數線：${q.from} → ${q.to}`;meta={steps:q.steps};}
else if(mode==='tens'){ok=q.t*10+q.u===q.n&&q.u<10;detail=`十進位：${q.n} = ${q.t}十 ${q.u}一`;meta={kind:q.kind,steps:q.steps};}
else if(mode==='calc'){const moved=zoneBeads(q.sub?'out':'target').length;const n=q.a+(q.sub?-q.b:q.b);ok=moved===q.b;detail=`${q.a}${q.sub?'−':'＋'}${q.b} = ${n}`;meta={moves:q.steps,operation:q.sub?'sub':'add'};}
if(ok)win(detail,meta);else wrongAnswer();}
function addStep(target,d){if(done)return;const max=getRange();if(target==='split'){let side=Number(document.activeElement?.dataset?.zone)||0;return;}if(target==='line'||target==='calc'){let v=q.current+d;if(target==='line'&&(v<q.lineMin||v>q.lineMax))return;if(v<0||v>max)return;q.current=v;q.steps.push(d);feedback='';}else if(target==='fill'){let v=q.start+q.added+d;if(v<0||v>max)return;q.added+=d;q.steps.push(d);}else if(target==='tens'||target==='free'){const t=q.t+(d===10?1:d===-10?-1:0),u=q.u+(d===1?1:d===-1?-1:0);if(t<0||u<0||u>19||t*10+u>max)return;q.t=t;q.u=u;q.steps.push(d);}render();}
function splitStep(which,d){if(!q.parts)return;const idx=Number(which),v=q.parts[idx]+d;if(v<0||sum(q.parts)-q.parts[idx]+v>q.n)return;q.parts[idx]=v;q.moves.push({part:idx,d});render();}

function moveWorkshopPiece(kind,source,dest){
 if(done&&mode!=='free')return;
 if(!['free','tens'].includes(mode))return;
 const orig=q.t*10+q.u,max=getRange();let t=q.t,u=q.u,justPacked=false;
 if(kind==='ten'&&source==='stock-ten'&&dest==='board-ten'&&orig+10<=max)t++;
 else if(kind==='ten'&&source==='board-ten'&&dest==='stock-ten'&&t>=1)t--;
 else if(kind==='one'&&source==='stock-one'&&dest==='board-one'&&orig+1<=max){
   u++;
   if(u===10){t++;u=0;justPacked=true;}
 }
 else if(kind==='one'&&source==='board-one'&&dest==='stock-one'&&u>0)u--;
 else return;
 q.t=t;q.u=u;q.justPacked=justPacked;
 q.steps.push({from:source,to:dest,size:kind==='ten'?10:1,autoPacked:justPacked});
 feedback='';playSound(justPacked?'win':'move');render();
}
function lineToPoint(clientX){if(mode!=='line'||done)return;const el=document.querySelector('[data-line]');if(!el)return;const r=el.getBoundingClientRect();const v=clamp(Math.round(q.lineMin+(clientX-r.left)/r.width*(q.lineMax-q.lineMin)),q.lineMin,q.lineMax);if(v!==q.current){q.steps.push(v-q.current);q.current=v;feedback='';render();}}
function exchange(which,dir){if(done)return;const t=q.t,u=q.u;if(dir==='up'&&u>=10){q.t++;q.u-=10;}else if(dir==='down'&&t>=1&&u<=9){q.t--;q.u+=10;}else return;q.steps.push(dir==='up'?'10一→1十':'1十→10一');render();}
function bridgePart(v){if(done)return;if(q.stage===1){if(Number(v)!==q.step){wrongAnswer();return;}q.stage=2;q.picked=Number(v);q.steps.push('到整十 '+q.step);q.finalChoices=optionsFor(q.answer,100,0);feedback='';render();}else if(q.stage===2){Number(v)===q.answer?win(`${q.a}${q.sub?'−':'＋'}${q.b} = ${q.answer}`,{steps:q.steps,part1:q.step}):wrongAnswer();}}
function resetTask(){wrong=0;hints=0;feedback='';if(mode==='split'||mode==='fill') {q.beads=q.beads.map(()=> 'pool');q.moves=[];q.steps=[];}else if(mode==='calc'){q.beads=q.beads.map(()=>q.sub?'source':'pool');q.current=q.a;q.steps=[];}else if(mode==='line'){q.current=q.from;q.steps=[];}else if(mode==='tens'){if(q.kind==='build'){q.t=0;q.u=0;}else{q.t=Math.floor(q.n/10)-1;q.u=9;}q.justPacked=false;q.steps=[];}else if(mode==='free'){q.t=0;q.u=0;q.justPacked=false;q.steps=[];}render();}
function exportEvents(){const payload={app:'數感小島',version:'2.4.0',exportedAt:dt(),note:'操作記錄；非標準化數學能力診斷',events:history};const str=JSON.stringify(payload,null,2),blob=new Blob([str],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`數感小島-0到100-紀錄-${dt().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importEvents(file){if(!file||file.size>2e6){alert('檔案過大或無法讀取。');return;}let data;try{data=JSON.parse(await file.text());if(!Array.isArray(data.events))throw Error('format');}catch(e){alert('這不是有效的數感小島紀錄檔。');return;}const seen=new Set(history.map(e=>e.uid||`${e.time}|${e.mode}|${e.detail}`));let n=0;for(const x of data.events){if(!x||typeof x!=='object'||!MODES[x.mode]||typeof x.time!=='string'||x.time.length>64||typeof x.detail!=='string'||x.detail.length>500)continue;const key=x.uid||`${x.time}|${x.mode}|${x.detail}`;if(seen.has(key))continue;seen.add(key);const {id,...obj}=x;obj.uid=obj.uid||makeUID();obj.success=Boolean(obj.success);obj.independent=Boolean(obj.independent);obj.wrong=Number(obj.wrong||0);obj.hints=Number(obj.hints||0);obj.range=[10,20,100].includes(Number(obj.range))?Number(obj.range):10;history.push(obj);n++;if(db){try{db.transaction('events','readwrite').objectStore('events').add(obj);}catch(e){dbFallback=true;}}}if(!db||dbFallback){try{localStorage.setItem('num-island-backup',JSON.stringify(history));}catch(e){}}render();alert(`已匯入 ${n} 筆新紀錄。`);}
async function eraseHistory(){history=[];if(db){await new Promise(resolve=>{try{const tx=db.transaction('events','readwrite');tx.objectStore('events').clear();tx.oncomplete=resolve;tx.onerror=resolve;}catch(e){resolve();}});}try{localStorage.removeItem('num-island-backup');}catch(e){}modal='';render();}
ROOT.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,val=b.dataset.val;
if(!['choice','compare','check','bridge-step','bridge-final','sound','voice','next-character','speak'].includes(act))playSound('tap');
if(act==='next-character'){nextCharacter();}
else if(act==='speak'){speechSay(taskVoice());}
else if(act==='coin'){modal=`<div class="modal-shade"><div class="modal coin-modal"><div style="font-size:68px">🪙</div><h2>${coins}</h2><p>答對一題 ＋1 🪙<br>可以和家長約定獎勵 🎁</p><button class="btn primary" data-modal="cancel">✓</button></div></div>`;render();}
else if(act==='voice'){voiceOn=!voiceOn;try{localStorage.setItem('num-island-voice-v24',voiceOn?'on':'off');}catch(e){};render();if(voiceOn)speechSay('語音開啟了');}
else if(act==='sound'){soundOn=!soundOn;try{localStorage.setItem('num-island-sound-v21',soundOn?'on':'off');}catch(e){}if(soundOn)playSound('tap');render();}
else if(act==='character'){character=CHARACTERS.some(x=>x[0]===val)?val:'bunny';try{localStorage.setItem('num-island-character-v21',character);}catch(e){}render();}
else if(act==='home'){if(autoNextTimer){clearTimeout(autoNextTimer);autoNextTimer=null;}view='home';render();}else if(act==='parent'){view='parent';render();}else if(act==='scope'){saveScope(Number(val));}else if(act==='start'){start(b.dataset.mode);}else if(act==='next'){replay();}else if(act==='hint'){hints++;feedback='hint';render();}else if(act==='choice'){answerValue(val);}else if(act==='compare'){compare(val);}else if(act==='selected-zone'){selectedZone=b.dataset.zone;render();}else if(act==='split-style'){splitStyle=val;q.style=val;q.goal=val==='goal';q.beads=q.beads.map(()=> 'pool');q.moves=[];render();}else if(act==='split-step'){splitStep(b.dataset.zone,Number(b.dataset.delta));}else if(act==='check'){check();}else if(act==='reset'){resetTask();}else if(act==='fill-cell'){if(done)return;const i=Number(b.dataset.i);if(i<q.start||i>=10)return;q.filled=q.filled.includes(i)?q.filled.filter(x=>x!==i):[...q.filled,i];render();}else if(act.endsWith('-step')&&['line','calc','tens','fill','free'].includes(act.split('-')[0])){addStep(act.split('-')[0],Number(val));}else if(act==='exchange'||act==='free-exchange'){exchange(act,b.dataset.dir);}else if(act==='bridge-step'||act==='bridge-final'){bridgePart(val);}else if(act==='export'){exportEvents();}else if(act==='import'){document.getElementById('import-file').click();}else if(act==='erase'){modal=`<div class="modal-shade"><div class="modal"><h2>確定要清除紀錄嗎？</h2><p>這會移除目前裝置儲存的所有學習紀錄，無法復原。建議先匯出備份。</p><div class="actionbar"><button class="btn light" data-modal="cancel">取消</button><button class="btn warn" data-modal="erase">確認清除</button></div></div></div>`;render();}});
ROOT.addEventListener('change',e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];importEvents(file);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;if(b.dataset.modal==='erase')eraseHistory();else{modal='';render();}});
ROOT.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-bead],[data-piece],[data-line]');if(!el||done||view!=='game')return;
 if(el.hasAttribute('data-line')){e.preventDefault();drag={kind:'line'};lineToPoint(e.clientX);return;}
 if(el.hasAttribute('data-bead')&&!['split','fill','calc'].includes(mode))return;
 if(el.hasAttribute('data-piece')&&!['tens','free'].includes(mode))return;
 e.preventDefault();const ghost=el.cloneNode(true);ghost.removeAttribute('data-bead');ghost.removeAttribute('data-piece');ghost.classList.add('drag-ghost');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);
 drag={kind:el.hasAttribute('data-bead')?'bead':'piece',index:Number(el.dataset.bead),piece:el.dataset.piece,source:el.dataset.source,x:e.clientX,y:e.clientY,moved:false,ghost};
});
window.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(drag.kind==='line'){lineToPoint(e.clientX);return;}
 drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
 if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>12)drag.moved=true;
 document.querySelectorAll('[data-drop].drag-hover').forEach(x=>x.classList.remove('drag-hover'));
 const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(zone)zone.classList.add('drag-hover');
});
window.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.kind==='line'){lineToPoint(e.clientX);return;}
 d.ghost.remove();suppressClickUntil=Date.now()+170;
 document.querySelectorAll('[data-drop].drag-hover').forEach(x=>x.classList.remove('drag-hover'));
 const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]')?.dataset.drop;
 if(!d.moved||!zone)return;
 if(d.kind==='bead')beadMove(d.index,zone);
 if(d.kind==='piece')moveWorkshopPiece(d.piece,d.source,zone);
});
window.addEventListener('pointercancel',()=>{if(drag){drag.ghost?.remove();drag=null;}document.querySelectorAll('[data-drop].drag-hover').forEach(x=>x.classList.remove('drag-hover'));});
window.addEventListener('offline',()=>{render();});window.addEventListener('online',()=>{render();});
window.__numberSenseCheck={peek:()=>({mode,level,q,wrong,hints,done}),start:(m,l)=>{if(l)level=l;start(m);},check,progress:()=>history};
render();storageInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').then(async()=>{try{await navigator.serviceWorker.ready;const c=await caches.open('number-island-cache-v24');offlineReady=(await Promise.all(['./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png'].map(p=>c.match(p)))).every(Boolean);render();}catch(e){}}).catch(()=>{});}
})();
</script>
