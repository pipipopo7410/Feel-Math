<script>
(()=>{'use strict';
const ROOT=document.getElementById('app');
const MODES={

 compare:{title:'比一比',icon:'⚖️',desc:'多、少、同樣多',domain:'B'},

 tens:{title:'十的魔法',icon:'🔟',desc:'十個一，變成一個十',domain:'E'},
 bridge:{title:'跨十小橋',icon:'🌉',desc:'湊整十，再走幾步',domain:'E'},

};
const DOMAINS={A:'數量與符號',B:'數量比較',C:'分解與合成',D:'數序與距離',E:'十進位與位值',F:'運算與策略'};
const oldModes=new Set(['count','compare','split','fill']);
const htm=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const shuffle=xs=>xs.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sum=(xs)=>xs.reduce((a,b)=>a+b,0);
const dt=()=>new Date().toISOString();
let level=Number(localStorage.getItem('num-island-scope-v2')||10);if(![10,20,100].includes(level))level=10;
let view='home',mode='count',q=null,rounds={},wrong=0,hints=0,done=false,db=null,history=[],dbFallback=false,offlineReady=false,feedback='',modal='',selectedZone='left',splitStyle='free',drag=null,suppressClickUntil=0;
const existing=()=>history.filter(e=>e.mode&&MODES[e.mode]);
const getRange=(m=mode)=>['bridge','tens'].includes(m)?Math.max(20,level):level;
const eventsFor=(m,range)=>history.filter(e=>e.mode===m&&(range==null||Number(e.range||10)===range));
function learningStatus(es){let clean=es.filter(e=>e.independent).length;let ranges=new Set(es.filter(e=>e.independent).map(e=>e.range||10));if(!es.length)return {name:'尚未觀察',pct:0};if(!clean)return {name:'目前需要支持',pct:13};if(clean<3)return {name:'開始累積證據',pct:30};if(clean<7)return {name:'熟悉任務可獨立完成',pct:61};if(ranges.size>=2)return {name:'跨數量範圍持續觀察',pct:90};return {name:'熟悉範圍表現穩定',pct:76};}
function recommend(){const cnt=eventsFor('count'), cmp=eventsFor('compare'), spl=eventsFor('split'), tens=eventsFor('tens');if(cnt.filter(e=>e.independent).length<3)return 'count';if(cmp.filter(e=>e.independent).length<3)return 'compare';if(spl.filter(e=>e.independent).length<3)return 'split';if(level===100&&tens.filter(e=>e.independent).length<3)return 'tens';const sorted=Object.keys(MODES).filter(x=>x!=='free').sort((a,b)=>eventsFor(a).length-eventsFor(b).length);return sorted[0]||'line';}
function saveScope(v){level=v;try{localStorage.setItem('num-island-scope-v2',String(v));}catch(e){}render();}
function makeUID(){return 'ns-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
async function storageInit(){try{db=await new Promise((resolve,reject)=>{let r=indexedDB.open('num-island-logs-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('events'))r.result.createObjectStore('events',{keyPath:'id',autoIncrement:true});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});history=await new Promise((resolve,reject)=>{const r=db.transaction('events','readonly').objectStore('events').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}catch(e){dbFallback=true;db=null;try{history=JSON.parse(localStorage.getItem('num-island-backup')||'[]');if(!Array.isArray(history))history=[];}catch(_){history=[];}}render();}
function saveEvent(detail,metadata={}){const event={uid:makeUID(),mode,range:getRange(),time:dt(),success:true,independent:wrong===0&&hints===0,wrong,hints,detail,...metadata};history.push(event);if(db){try{db.transaction('events','readwrite').objectStore('events').add(event);}catch(e){dbFallback=true;}}if(!db||dbFallback){try{localStorage.setItem('num-island-backup',JSON.stringify(history));}catch(e){}}}
function win(detail,meta={}){if(done)return;done=true;feedback='success';saveEvent(detail,meta);render();}
function challengeNum(max,min=0,m=''){const round=rounds[m]||0, anchors=[0,1,9,10,11,19,20,21,29,30,49,50,51,79,90,98,99,100].filter(n=>n>=min&&n<=max);if(round%5===0)return anchors[rand(0,anchors.length-1)];if(round%7===0)return [max,min,Math.min(max,10),Math.min(max,20)][rand(0,3)];return rand(min,max);}
function optionsFor(answer,max=100,min=0){let xs=new Set([answer]);const offsets=shuffle([1,-1,2,-2,10,-10,9,-9,5,-5,11,-11,20,-20]);for(const delta of offsets){if(xs.size>=3)break;let n=answer+delta;if(n>=min&&n<=max)xs.add(n);}while(xs.size<3){let k=rand(min,max);xs.add(k);}return shuffle([...xs]);}
function generate(m){rounds[m]=(rounds[m]||0)+1;const max=getRange(m),r=rounds[m];if(m==='count'){let n=challengeNum(max,0,m);return {n,choices:optionsFor(n,max,0),style:n<=20?(r%4===0?'dots':'frames'):'blocks'};}
if(m==='compare'){let a=challengeNum(max,0,m),b;if(r%4===0){b=a;}else {const d=rand(1,max<=10?4:max<=20?7:20)*(Math.random()<.5?1:-1);b=clamp(a+d,0,max);if(a===b)b=a===max?max-1:a+1;}return {a,b};}
if(m==='split'){let n=challengeNum(max,2,m);let goal=(r%3===0);let target=rand(1,n-1);return {n,style:splitStyle,goal,target,beads:n<=10?Array.from({length:n},()=> 'pool'):null,parts:[0,0],moves:[]};}
if(m==='fill'){let total=challengeNum(max,1,m),start=rand(0,total-1),delta=total-start;if(max>20){delta=rand(1,Math.min(total,24));start=total-delta;}return {total,start,filled:[],added:0,steps:[]};}
if(m==='line'){let from=challengeNum(max,0,m),delta=(max<=10?rand(1,5):max<=20?rand(1,9):rand(1,18))*(r%2===0?-1:1);if(from+delta<0||from+delta>max)delta=-delta;if(from+delta<0||from+delta>max)delta=from===0?1:-1;let to=from+delta;return {from,to,current:from,steps:[]};}
if(m==='tens'){if(r%3===0){let n=challengeNum(max,10,m),t=Math.floor(n/10),u=n%10;if(t>=1){return {kind:'exchange',n,t:t-1,u:u+10,steps:[]};}}return {kind:'build',n:challengeNum(max,0,m),t:0,u:0,steps:[]};}
if(m==='bridge'){const sub=r%2===0;let candidates=[];if(sub){for(let a=11;a<=max;a++){let unit=a%10;if(unit<1||unit>8)continue;for(let b=unit+1;b<=Math.min(9,a);b++)candidates.push([a,b]);}}else{for(let a=1;a<max;a++){let u=a%10;if(!u)continue;const first=10-u;for(let b=first+1;b<=Math.min(9,max-a);b++)candidates.push([a,b]);}}if(!candidates.length){return {sub:false,a:8,b:5,step:2,stage:1,picked:null,choices:[2,1,3],answer:13,steps:[]};}const [a,b]=candidates[rand(0,candidates.length-1)],step=sub?a%10:10-a%10;return {sub,a,b,step,stage:1,picked:null,choices:optionsFor(step,9,1),answer:a+(sub?-b:b),steps:[]};}
if(m==='calc'){let sub=r%2===0,a,b;if(sub){a=challengeNum(max,1,m);b=rand(1,Math.min(a,max===100?30:8));}else{a=challengeNum(max-1,0,m);b=rand(1,Math.min(max-a,max===100?30:8));}return {a,b,sub,current:a,steps:[]};}
return {t:0,u:0,steps:[]};}
function start(m){mode=m;view='game';wrong=0;hints=0;done=false;feedback='';selectedZone='left';q=generate(m);render();}
function replay(){start(mode);}
function blocks(n,compact=false){let t=Math.floor(n/10),u=n%10;return `<div class="blocks ${compact?'compact':''}" aria-label="以十為單位的積木圖"><div class="ten-rods">${Array.from({length:t},()=>`<span class="rod" aria-label="一個十">${Array.from({length:10},()=>'<i></i>').join('')}</span>`).join('')}</div><div class="units">${Array.from({length:u},()=>'<span class="unit" aria-label="一個一"></span>').join('')}</div>${n===0?'<span class="zero-empty" aria-label="空的"></span>':''}</div>`;}
function rawBlocks(t,u){return `<div class="blocks" aria-label="目前的十位與個位積木"><div class="ten-rods">${Array.from({length:t},()=>`<span class="rod" aria-label="一個十">${Array.from({length:10},()=>'<i></i>').join('')}</span>`).join('')}</div><div class="units">${Array.from({length:u},()=>'<span class="unit" aria-label="一個一"></span>').join('')}</div>${t+u===0?'<span class="zero-empty"></span>':''}</div>`;}
function frames(n){if(n===0)return '<span class="zero-empty" aria-label="沒有圓點"></span>';return `<div class="dotbox">${Array.from({length:Math.ceil(n/10)},(_,f)=>`<div class="ten-frame">${Array.from({length:10},(_,i)=>`<span class="cell">${f*10+i<n?'<span class="small-dot"></span>':''}</span>`).join('')}</div>`).join('')}</div>`;}
function dots(n){if(n===0)return '<span class="zero-empty"></span>';return `<div class="one-row">${Array.from({length:n},()=>'<span class="small-dot"></span>').join('')}</div>`;}
function represent(n,max=getRange(),style){return style==='dots'?dots(n):max<=20?frames(n):blocks(n);}
function iconButton(action,icon,label){return `<button class="iconbtn" data-action="${action}" aria-label="${htm(label)}" title="${htm(label)}">${icon}</button>`;}
function header(){return `<header class="topbar"><div class="brand"><i>🌱</i>數感小島 <span style="font-size:11px;color:#ad8d52;font-weight:800">0～100</span></div><div class="top-actions"><span class="net">● ${offlineReady||!navigator.onLine?'可離線使用':'準備離線中'}</span>${view!=='home'?iconButton('home','⌂','回到遊戲首頁'):''}${iconButton('parent','📊','家長觀察室')}</div></header>`;}
function home(){const recomm=recommend();return `<section class="head-card"><div><div class="smallcap">EXPLORE · PLAY · DISCOVER</div><h1>用小手，發現數字的秘密</h1><p>九個探險遊戲，從零到一百，自由挑戰。</p></div><div class="hero-dots">🔵 ✨ 🟡</div></section><section class="range-card"><strong>🌿 數量範圍</strong><div class="segmented">${[10,20,100].map(v=>`<button class="${level===v?'active':''}" data-action="scope" data-val="${v}" aria-pressed="${level===v}">0～${v}</button>`).join('')}</div><span class="range-info">可以跳關，難度不會因年齡被鎖住</span></section><h2 class="section-label">☀️ 今天想去哪個島？</h2><section class="tiles">${Object.entries(MODES).map(([k,x])=>`<button class="tile go-${k}" data-action="start" data-mode="${k}"><span class="tile-icon">${x.icon}</span><span class="tile-body"><strong>${x.title}</strong><small>${x.desc}</small></span>${recomm===k?'<em>推薦</em>':''}</button>`).join('')}</section><p class="tiny-note">每個關卡都可以自由選擇｜零包含在課程中｜本機自動記錄操作表現｜部分高階遊戲從 0～20 開始</p>`;}
function stageTop(){const n=eventsFor(mode,getRange()).slice(-5).filter(e=>e.independent).length;return `<div class="activity-title">${iconButton('home','←','返回')}<strong>${MODES[mode].icon} ${MODES[mode].title}</strong><span class="chip">0～${getRange()}</span></div><main class="stage"><div class="stage-top"><span class="goal">${'★'.repeat(n)}${'☆'.repeat(Math.max(0,3-n))}</span><button class="iconbtn" data-action="hint" aria-label="圖像提示" title="圖像提示" style="min-width:43px;min-height:43px;width:43px;height:43px">❔</button></div>`;}
function footer(){let msg='';if(done)msg=`<div class="feedback ok">✨　完成了！你找到一種方法。</div><div class="actionbar"><button class="btn primary" data-action="next">下一題　➜</button><button class="btn light" data-action="home">⌂</button></div>`;else if(feedback==='wrong'||wrong>0)msg=`<div class="feedback">👀　再觀察一下${hints>0?'，也可以試著利用十個一組': ''}。</div>`;else if(hints>0)msg=`<div class="feedback info">${hintText()}</div>`;return msg+'</main>';}
function hintText(){return ({count:'🔟　＋　🟡　→　❓',compare:'🔟　⚖️　🟡',split:'↙️　🟢　↘️',fill:'🎯　＋　🟢',line:'🚂　＋1　＋10',tens:'🟡 × 10　↔　🔟',bridge:'🌉　🔟　→　🏁',calc:'✨　＋10　＋1',free:'🎨　🔟　↔　🟡 × 10'})[mode];}
function choices(qs,action='choice'){return `<div class="choice-grid">${qs.map((x,i)=>`<button class="choice" data-action="${action}" data-val="${x}">${x}</button>`).join('')}</div>`;}
function countView(){return `<div class="problem"><div class="question">👀 → ?</div><div class="visual-box">${represent(q.n,getRange(),q.style)}</div>${choices(q.choices)}</div>`;}
function compareView(){return `<div class="problem"><div class="question" aria-label="找出比較多的一邊">👀　⬅️　❓　➡️</div><div class="compare-layout"><button class="compare-side" data-action="compare" data-val="left" aria-label="左邊比較多">${represent(q.a)}</button><button class="equal-btn" data-action="compare" data-val="equal" aria-label="一樣多">=</button><button class="compare-side right" data-action="compare" data-val="right" aria-label="右邊比較多">${represent(q.b)}</button></div></div>`;}
function bead(i){return `<button class="bead" data-bead="${i}" aria-label="第${i+1}顆圓點，可拖到盤子"></button>`;}
function tray(z){const active=q.beads.filter(x=>x===z),n=active.length;return `<div class="tray ${z} ${selectedZone===z?'selected':''}" data-zone="${z}" data-action="selected-zone"><h3>${z==='left'?'🔵':'🟠'} ${q.goal&&z==='left'?`🎯 ${q.target}`: ''}</h3><div class="contents">${active.map((x,i)=>bead(q.beads.indexOf(x,i))).join('')}</div><span class="numout">${n}</span></div>`;}
function trayBeads(z){return q.beads.map((t,i)=>t===z?bead(i):'').join('');}
function splitLow(){return `<div class="split-board"><div class="question">${q.n} ↙ ↘</div><div class="actionbar"><button class="btn ${q.style==='free'?'primary':'light'}" data-action="split-style" data-val="free" aria-label="自由分組">🎨</button><button class="btn ${q.style==='goal'?'primary':'light'}" data-action="split-style" data-val="goal" aria-label="指定分組">🎯</button></div><div class="split-parts">${['left','right'].map(z=>`<div class="tray ${z} ${selectedZone===z?'selected':''}" data-zone="${z}" data-action="selected-zone"><h3>${z==='left'?'🔵':'🟠'} ${q.style==='goal'&&z==='left'?`→ ${q.target}`:''}</h3><div class="contents">${trayBeads(z)}</div><span class="numout">${q.beads.filter(x=>x===z).length}</span></div>`).join('')}</div><div class="pool" data-zone="pool">${trayBeads('pool')}${q.beads.every(z=>z!=='pool')?'✓':''}</div><div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div><span class="micro">可把圓點拖進盤子，也可點一下移動</span></div>`;}
function stepButtons(id,v,total,full=false){const can=(d)=>total+d>=0&&total+d<=q.n;return `<div class="step-grid"><button data-action="split-step" data-zone="${id}" data-delta="10" ${can(10)?'':'disabled'}>＋10</button><button data-action="split-step" data-zone="${id}" data-delta="1" ${can(1)?'':'disabled'}>＋1</button><button data-action="split-step" data-zone="${id}" data-delta="-1" ${v>=1?'':'disabled'}>－1</button><button data-action="split-step" data-zone="${id}" data-delta="-10" ${v>=10?'':'disabled'}>－10</button></div>`;}
function splitHigh(){const a=q.parts[0],b=q.parts[1],rest=q.n-a-b;return `<div class="split-board"><div class="question">${q.n} ↙ ↘</div><div class="actionbar"><button class="btn ${q.style==='free'?'primary':'light'}" data-action="split-style" data-val="free">🎨</button><button class="btn ${q.style==='goal'?'primary':'light'}" data-action="split-style" data-val="goal">🎯</button></div><div class="split-parts">${[0,1].map(i=>`<div class="tray ${i?'right':'left'}"><h3>${i?'🟠':'🔵'} ${q.style==='goal'&&!i?`🎯 ${q.target}`:''}</h3><strong class="numout">${q.parts[i]}</strong><div class="number-chunk">${blocks(q.parts[i],true)}</div>${stepButtons(String(i),q.parts[i],a+b)}</div>`).join('')}</div><div class="visual-box" style="min-height:80px"><span class="micro">還沒分配　</span>${blocks(rest,true)}</div><div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;}
function splitView(){return `<div class="problem">${q.beads?splitLow():splitHigh()}</div>`;}
function fillView(){const high=getRange()>20||q.total>10,n=q.start+(high?q.added:q.filled.length);if(!high)return `<div class="problem"><div class="question">${q.start} + ? = ${q.total}</div><div class="visual-box small"><div class="ten-frame fill-grid">${Array.from({length:10},(_,i)=>`<button class="cell" data-action="fill-cell" data-i="${i}" style="background:${q.filled.includes(i)?'#e2faf0':i<q.start?'#e1f1ff':'#fff'};height:32px;width:32px;cursor:${i>=q.start?'pointer':'default'}">${i<q.start?'<span class="small-dot blue"></span>':q.filled.includes(i)?'<span class="small-dot"></span>':''}</button>`).join('')}</div></div><div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;
return `<div class="problem"><div class="question">${q.start} + ? = ${q.total}</div><div class="journey"><div class="pnum">${q.start}</div><span class="op">＋</span><div class="pnum">${q.added}</div><span class="op">＝</span><div class="pnum">${n}</div></div><div class="visual-box blue">${blocks(n)}</div>${stepperControls('fill',n,getRange())}<div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;}
function stepperControls(prefix,current,max,negative=false){return `<div class="actionbar"><button class="btn step" data-action="${prefix}-step" data-val="10" ${current+10>max?'disabled':''}>＋10</button><button class="btn step" data-action="${prefix}-step" data-val="1" ${current+1>max||(prefix==='free'&&q.u>=19)?'disabled':''}>＋1</button><button class="btn step light" data-action="${prefix}-step" data-val="-1" ${current-1<0?'disabled':''}>－1</button><button class="btn step light" data-action="${prefix}-step" data-val="-10" ${current-10<0?'disabled':''}>－10</button></div>`;}
function numberline(n,goal,max,showGoal){const ticks=Array.from({length:max/ (max===100?10:max===20?5:2)+1},(_,i)=>i*(max===100?10:max===20?5:2));if(ticks[ticks.length-1]!==max)ticks.push(max);let loc=x=>100*x/max;return `<div class="numberline" aria-label="數線從 0 到 ${max}"><div class="line-main">${ticks.map(t=>`<span class="tick" style="left:${loc(t)}%"><span>${t}</span></span>`).join('')}<span class="line-marker" style="left:${loc(n)}%">${n}</span>${showGoal?`<span class="line-marker goal" style="left:${loc(goal)}%">🎯</span>`:''}</div></div>`;}
function lineView(){const max=getRange();return `<div class="problem"><div class="question">${q.from} → 🎯 ${q.to}</div>${numberline(q.current,q.to,max,true)}<div class="history-hops">${q.steps.slice(-10).map(s=>`<span>${s>0?'+':''}${s}</span>`).join('')}</div>${stepperControls('line',q.current,max)}<div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;}
function builderControls(t,u){let n=t*10+u;return `<div class="actionbar"><button class="btn step" data-action="tens-step" data-val="10" ${n+10>getRange()?'disabled':''}>＋10</button><button class="btn step" data-action="tens-step" data-val="1" ${n+1>getRange()||u>=19?'disabled':''}>＋1</button><button class="btn step light" data-action="tens-step" data-val="-1" ${u<1?'disabled':''}>－1</button><button class="btn step light" data-action="tens-step" data-val="-10" ${t<1?'disabled':''}>－10</button></div>`;}
function tensView(){let sumNow=q.t*10+q.u;return `<div class="problem"><div class="question">${q.kind==='exchange'?`${q.n}　↔　🔟`:`${q.n}　→　🧱`}</div><div class="visual-box" style="min-height:155px">${rawBlocks(q.t,q.u)}</div><div class="journey"><span class="pnum" style="font-size:26px">${q.t} 十</span><span class="op">＋</span><span class="pnum" style="font-size:26px">${q.u} 一</span></div>${q.kind==='build'?builderControls(q.t,q.u):''}<div class="actionbar"><button class="ten-switch" data-action="exchange" data-dir="up" ${q.u<10?'disabled':''}>🔟　10 個一 → 1 個十</button><button class="ten-switch" data-action="exchange" data-dir="down" ${q.t<1||q.u>9?'disabled':''}>↩　1 個十 → 10 個一</button></div><div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;}
function bridgeView(){const step=q.step,into=q.a+(q.sub?-step:step),remaining=q.b-step;if(q.stage===1)return `<div class="problem"><div class="question">${q.a} ${q.sub?'−':'＋'} ${q.b} = ?</div><div class="journey"><span class="pnum">${q.a}</span><span class="op">${q.sub?'−':'＋'}</span><span class="pnum">?</span><span class="op">→</span><span class="pnum">${into}</span></div><div class="bridge-dots">${Array.from({length:q.b},()=>'<span class="unit"></span>').join('')}</div><span class="micro" aria-label="先到整十，需要幾個">👣　→　🔟　❓</span>${choices(q.choices,'bridge-step')}<div class="progress-bar"><i class="on"></i><i></i></div></div>`;return `<div class="problem"><div class="question">${q.a} ${q.sub?'−':'＋'} ${q.b} = ?</div><div class="journey"><span class="pnum">${q.a}</span><span class="op">${q.sub?'−':'＋'} ${step}</span><span class="op">→</span><span class="pnum">${into}</span><span class="op">${q.sub?'−':'＋'} ${remaining}</span><span class="op">→</span><span class="pnum">?</span></div><div class="bridge-dots">${Array.from({length:remaining},()=>'<span class="unit"></span>').join('')}</div><span class="micro" aria-label="繼續走剩下的步數">👣　→　🏁　❓</span>${choices(q.finalChoices||optionsFor(q.answer,100,0),'bridge-final')}<div class="progress-bar"><i class="on"></i><i class="on"></i></div></div>`;}
function calcView(){let max=getRange(),target=q.a+(q.sub?-q.b:q.b);return `<div class="problem"><div class="question">${q.a} ${q.sub?'−':'＋'} ${q.b} = ?</div><div class="journey"><div class="pnum">${q.current}</div><span class="op">📍</span></div>${numberline(q.current,target,max,false)}<div class="history-hops">${q.steps.slice(-11).map(s=>`<span>${s>0?'+':''}${s}</span>`).join('')}</div>${stepperControls('calc',q.current,max)}<div class="actionbar"><button class="btn primary" data-action="check">✓</button><button class="btn light" data-action="reset">↺</button></div></div>`;}
function freeView(){let n=q.t*10+q.u;return `<div class="problem"><div class="freestyle"><div class="question">🎨　${n}</div><div class="visual-box blue">${rawBlocks(q.t,q.u)}</div><div class="journey"><span class="pnum" style="font-size:24px">${q.t} 十</span><span class="op">＋</span><span class="pnum" style="font-size:24px">${q.u} 一</span></div>${stepperControls('free',n,getRange())}<div class="actionbar"><button class="btn secondary" data-action="free-exchange" data-dir="up" ${q.u<10?'disabled':''}>10 個一 → 1 個十</button><button class="btn secondary" data-action="free-exchange" data-dir="down" ${q.t<1||q.u>9?'disabled':''}>1 個十 → 10 個一</button></div><div class="actionbar"><button class="btn light" data-action="reset">↺</button></div><span class="micro">自由探索不會被評分，也不算作能力掌握。</span></div></div>`;}
const SCREENS={count:countView,compare:compareView,split:splitView,fill:fillView,line:lineView,tens:tensView,bridge:bridgeView,calc:calcView,free:freeView};
function game(){return stageTop()+SCREENS[mode]()+footer();}
function parent(){const logs=existing().filter(e=>e.success),clean=logs.filter(e=>e.independent).length, ranges=new Set(logs.map(e=>e.range||10));const summary=`<div class="metrics"><div class="metric"><small>完成任務</small><strong>${logs.length}</strong></div><div class="metric"><small>未使用提示完成</small><strong>${clean}</strong></div><div class="metric"><small>接觸的數量範圍</small><strong>${ranges.size} / 3</strong></div></div>`;
const domains=Object.entries(DOMAINS).map(([d,title])=>{let ev=logs.filter(e=>MODES[e.mode]?.domain===d),st=learningStatus(ev),ind=ev.filter(e=>e.independent).length;return `<div class="skillrow"><strong>${d}｜${title}</strong><small>${st.name} · 完成 ${ev.length} 次 · 無提示 ${ind} 次</small><div class="meter"><span style="width:${st.pct}%"></span></div></div>`;}).join('');
const rows=logs.slice(-17).reverse().map(e=>`<tr><td>${htm(new Date(e.time).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</td><td>${htm(MODES[e.mode]?.title||e.mode)}</td><td>${htm(String(e.detail||'完成任務'))}</td><td>${e.independent?'無提示':'有協助'}</td></tr>`).join('');
return `<section class="parent"><div><h1>📊 家長觀察室</h1><p>觀察孩子操作了什麼、遇到哪些挑戰，以及是否需要提示。這不是標準化測驗，也不據此判斷孩子的智力。</p></div>${summary}<div class="parent-content"><section class="parent-panel"><h2>六大能力領域（操作證據）</h2>${domains}<div class="notice">🧠 狀態僅為探索用的觀察摘要；答對不代表一定用了某種心算策略。孩子可以自由跳關，未接觸的活動不等於不會。</div></section><section class="parent-panel"><h2>最近活動</h2><div class="log-list"><table><thead><tr><th>時間</th><th>活動</th><th>內容</th><th>表現</th></tr></thead><tbody>${rows||'<tr><td colspan="4">還沒有紀錄，先去玩一個遊戲吧！</td></tr>'}</tbody></table></div><h2 style="margin-top:16px">備份與管理</h2><div class="parent-actions"><button data-action="export">⬇ 匯出 JSON</button><button data-action="import">⬆ 匯入紀錄</button><button data-action="erase">🗑 清除紀錄</button><button data-action="home">⌂ 回遊戲</button></div><input id="import-file" class="hidden-input" type="file" accept=".json,application/json"><p style="font-size:12px">紀錄儲存在目前裝置的瀏覽器中。更換 iPad、清除網站資料或解除安裝可能造成資料遺失，建議定期匯出。舊版四種活動的紀錄，在相同網址／網站資料仍存在時可繼續保留。</p></section></div></section>`;}
function render(){ROOT.innerHTML=`<div class="app">${header()}${view==='home'?home():view==='parent'?parent():game()}<div class="tiny-note">數感小島 0～100 · 第二版教育原型 · 不以速度評分</div></div>${modal}`;}
function wrongAnswer(){wrong++;feedback='wrong';if(wrong>=2)hints=Math.max(1,hints);render();}
function answerValue(v){if(done)return;if(mode==='count'){Number(v)===q.n?win(`數量辨識：${q.n}`,{representation:q.style}):wrongAnswer();} }
function compare(v){if(done)return;const res=q.a===q.b?'equal':q.a>q.b?'left':'right';v===res?win(`比較 ${q.a} 和 ${q.b}`):wrongAnswer();}
function beadMove(i,zone){if(mode!=='split'||done||!q?.beads||!Number.isInteger(i)||i<0||i>=q.beads.length)return;const source=q.beads[i];let dest=['pool','left','right'].includes(zone)?zone:(source==='pool'?selectedZone:'pool');q.beads[i]=dest;q.moves.push({from:source,to:dest});render();}
function check(){if(done)return;let ok=false,detail='',meta={};if(mode==='split'){const isLow=!!q.beads,parts=isLow?[q.beads.filter(x=>x==='left').length,q.beads.filter(x=>x==='right').length]:q.parts;ok=parts[0]+parts[1]===q.n&&parts[0]>0&&parts[1]>0&&(q.style!=='goal'||parts[0]===q.target);detail=`${q.n} → ${parts[0]} + ${parts[1]}`;meta={parts,actions:q.moves.length,kind:q.style};}
else if(mode==='fill'){let filled=q.filled.length;ok=q.start+((getRange()>20||q.total>10)?q.added:filled)===q.total;detail=`補足：${q.start} + ${q.total-q.start} = ${q.total}`;meta={steps:q.steps};}
else if(mode==='line'){ok=q.current===q.to;detail=`數線：${q.from} → ${q.to}`;meta={steps:q.steps};}
else if(mode==='tens'){ok=q.t*10+q.u===q.n&&q.u<10;detail=`十進位：${q.n} = ${q.t}十 ${q.u}一`;meta={kind:q.kind,steps:q.steps};}
else if(mode==='calc'){let n=q.a+(q.sub?-q.b:q.b);ok=q.current===n;detail=`${q.a}${q.sub?'−':'＋'}${q.b} = ${n}`;meta={steps:q.steps,operation:q.sub?'sub':'add'};}
if(ok)win(detail,meta);else wrongAnswer();}
function addStep(target,d){if(done)return;const max=getRange();if(target==='split'){let side=Number(document.activeElement?.dataset?.zone)||0;return;}if(target==='line'||target==='calc'){let v=q.current+d;if(v<0||v>max)return;q.current=v;q.steps.push(d);}else if(target==='fill'){let v=q.start+q.added+d;if(v<0||v>max)return;q.added+=d;q.steps.push(d);}else if(target==='tens'||target==='free'){const t=q.t+(d===10?1:d===-10?-1:0),u=q.u+(d===1?1:d===-1?-1:0);if(t<0||u<0||u>19||t*10+u>max)return;q.t=t;q.u=u;q.steps.push(d);}render();}
function splitStep(which,d){if(!q.parts)return;const idx=Number(which),v=q.parts[idx]+d;if(v<0||sum(q.parts)-q.parts[idx]+v>q.n)return;q.parts[idx]=v;q.moves.push({part:idx,d});render();}
function exchange(which,dir){if(done)return;const t=q.t,u=q.u;if(dir==='up'&&u>=10){q.t++;q.u-=10;}else if(dir==='down'&&t>=1&&u<=9){q.t--;q.u+=10;}else return;q.steps.push(dir==='up'?'10一→1十':'1十→10一');render();}
function bridgePart(v){if(done)return;if(q.stage===1){if(Number(v)!==q.step){wrongAnswer();return;}q.stage=2;q.picked=Number(v);q.steps.push('到整十 '+q.step);q.finalChoices=optionsFor(q.answer,100,0);feedback='';render();}else if(q.stage===2){Number(v)===q.answer?win(`${q.a}${q.sub?'−':'＋'}${q.b} = ${q.answer}`,{steps:q.steps,part1:q.step}):wrongAnswer();}}
function resetTask(){wrong=0;hints=0;feedback='';if(mode==='split'){q.beads?q.beads=q.beads.map(()=> 'pool'):q.parts=[0,0];q.moves=[];}else if(mode==='fill'){q.filled=[];q.added=0;q.steps=[];}else if(mode==='line'||mode==='calc'){q.current=q.from??q.a;q.steps=[];}else if(mode==='tens'){if(q.kind==='build'){q.t=0;q.u=0;}else{q.t=Math.floor(q.n/10)-1;q.u=q.n%10+10;}q.steps=[];}else if(mode==='free'){q.t=0;q.u=0;q.steps=[];}render();}
function exportEvents(){const payload={app:'數感小島',version:'2.0.0',exportedAt:dt(),note:'操作記錄；非標準化數學能力診斷',events:history};const str=JSON.stringify(payload,null,2),blob=new Blob([str],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`數感小島-0到100-紀錄-${dt().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importEvents(file){if(!file||file.size>2e6){alert('檔案過大或無法讀取。');return;}let data;try{data=JSON.parse(await file.text());if(!Array.isArray(data.events))throw Error('format');}catch(e){alert('這不是有效的數感小島紀錄檔。');return;}const seen=new Set(history.map(e=>e.uid||`${e.time}|${e.mode}|${e.detail}`));let n=0;for(const x of data.events){if(!x||typeof x!=='object'||!MODES[x.mode]||typeof x.time!=='string'||x.time.length>64||typeof x.detail!=='string'||x.detail.length>500)continue;const key=x.uid||`${x.time}|${x.mode}|${x.detail}`;if(seen.has(key))continue;seen.add(key);const {id,...obj}=x;obj.uid=obj.uid||makeUID();obj.success=Boolean(obj.success);obj.independent=Boolean(obj.independent);obj.wrong=Number(obj.wrong||0);obj.hints=Number(obj.hints||0);obj.range=[10,20,100].includes(Number(obj.range))?Number(obj.range):10;history.push(obj);n++;if(db){try{db.transaction('events','readwrite').objectStore('events').add(obj);}catch(e){dbFallback=true;}}}if(!db||dbFallback){try{localStorage.setItem('num-island-backup',JSON.stringify(history));}catch(e){}}render();alert(`已匯入 ${n} 筆新紀錄。`);}
async function eraseHistory(){history=[];if(db){await new Promise(resolve=>{try{const tx=db.transaction('events','readwrite');tx.objectStore('events').clear();tx.oncomplete=resolve;tx.onerror=resolve;}catch(e){resolve();}});}try{localStorage.removeItem('num-island-backup');}catch(e){}modal='';render();}
ROOT.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,val=b.dataset.val;
if(act==='home'){view='home';render();}else if(act==='parent'){view='parent';render();}else if(act==='scope'){saveScope(Number(val));}else if(act==='start'){start(b.dataset.mode);}else if(act==='next'){replay();}else if(act==='hint'){hints++;feedback='hint';render();}else if(act==='choice'){answerValue(val);}else if(act==='compare'){compare(val);}else if(act==='selected-zone'){selectedZone=b.dataset.zone;render();}else if(act==='split-style'){splitStyle=val;q.style=val;q.goal=val==='goal';q.beads?q.beads=q.beads.map(()=> 'pool'):q.parts=[0,0];q.moves=[];render();}else if(act==='split-step'){splitStep(b.dataset.zone,Number(b.dataset.delta));}else if(act==='check'){check();}else if(act==='reset'){resetTask();}else if(act==='fill-cell'){if(done)return;const i=Number(b.dataset.i);if(i<q.start||i>=10)return;q.filled=q.filled.includes(i)?q.filled.filter(x=>x!==i):[...q.filled,i];render();}else if(act.endsWith('-step')&&['line','calc','tens','fill','free'].includes(act.split('-')[0])){addStep(act.split('-')[0],Number(val));}else if(act==='exchange'||act==='free-exchange'){exchange(act,b.dataset.dir);}else if(act==='bridge-step'||act==='bridge-final'){bridgePart(val);}else if(act==='export'){exportEvents();}else if(act==='import'){document.getElementById('import-file').click();}else if(act==='erase'){modal=`<div class="modal-shade"><div class="modal"><h2>確定要清除紀錄嗎？</h2><p>這會移除目前裝置儲存的所有學習紀錄，無法復原。建議先匯出備份。</p><div class="actionbar"><button class="btn light" data-modal="cancel">取消</button><button class="btn warn" data-modal="erase">確認清除</button></div></div></div>`;render();}});
ROOT.addEventListener('change',e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];importEvents(file);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;if(b.dataset.modal==='erase')eraseHistory();else{modal='';render();}});
ROOT.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-bead]');if(!b||mode!=='split'||done)return;e.preventDefault();const original=b.cloneNode(true);original.classList.add('ghost');original.style.left=e.clientX+'px';original.style.top=e.clientY+'px';document.body.appendChild(original);drag={i:Number(b.dataset.bead),startX:e.clientX,startY:e.clientY,moved:false,ghost:original};});
window.addEventListener('pointermove',e=>{if(!drag)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';if(Math.abs(e.clientX-drag.startX)+Math.abs(e.clientY-drag.startY)>15)drag.moved=true;});
window.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;d.ghost.remove();const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]')?.dataset.zone;suppressClickUntil=Date.now()+160;beadMove(d.i,d.moved?(zone||''):undefined);});
window.addEventListener('pointercancel',()=>{if(drag){drag.ghost.remove();drag=null;}});
window.addEventListener('offline',()=>{render();});window.addEventListener('online',()=>{render();});
window.__numberSenseCheck={peek:()=>({mode,level,q,wrong,hints,done}),start:(m,l)=>{if(l)level=l;start(m);},check,progress:()=>history};
render();storageInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').then(async()=>{try{await navigator.serviceWorker.ready;const c=await caches.open('number-island-cache-v2');offlineReady=(await Promise.all(['./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png'].map(p=>c.match(p)))).every(Boolean);render();}catch(e){}}).catch(()=>{});}
})();
</script>
